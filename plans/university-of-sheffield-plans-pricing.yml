description: 'The University of Sheffield sells no API. Its one institution-operated API, the Sheffield
  Solar API, is free: PV_Live and PV_Live_EU read endpoints are keyless and answered 200 on probe (2026-08-30),
  while PV_Forecast requires a free registered user identifier and returns 401 without one. Every other
  surface in this profile is a vendor-tenanted platform (figshare, EPrints, Ex Libris) whose commercial
  terms are the vendor''s, not Sheffield''s, or is gated behind the institution''s Shibboleth identity
  provider by affiliation rather than by payment.'
notes: No per-seat or per-call pricing exists. 'Free / Open' is the keyless PV_Live tier, verified live.
  'Affiliation / Credentialed' covers PV_Forecast registration and everything behind institutional SSO.
  Do not read the vendor platforms' pricing as Sheffield's.
sources:
- https://raw.githubusercontent.com/api-evangelist/university-of-sheffield/refs/heads/main/apis.yml
plans:
- id: university-of-sheffield-free-open
  name: Free / Open
  type: free
  description: Public open APIs (metadata, library, repository, course data) offered at no charge, generally
    for non-commercial use.
  entries:
  - label: Open API Access
    name: open_api_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    userMultiplied: false
- id: university-of-sheffield-affiliation
  name: Affiliation / Credentialed
  type: free
  description: Administrative and identity APIs gated behind institutional SSO, client certificates, or
    federation membership rather than payment.
  entries:
  - label: Credentialed Access
    name: credentialed_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
