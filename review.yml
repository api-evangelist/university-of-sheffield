- date: '2026-08-30'
  rating: 3
  summary: 'Re-profiled under the API Evangelist university pipeline with operator attribution settled
    before anything was saved. Found and verified a genuine institution-operated API that the 2026-06-03
    pass missed entirely: the Sheffield Solar API at api.solar.sheffield.ac.uk, which publishes its own
    OpenAPI 3.1 document and answers keyless PV_Live requests. Also confirmed the institution''s own Shibboleth
    SAML 2.0 identity provider serving live metadata from shef.ac.uk. Removed ten OpenAPI contracts and
    forty-one derived artifacts that were figshare''s, not Sheffield''s — the source document declared
    info.title ''Figshare API'' and servers https://api.figshare.com/v2. ORDA and both White Rose repositories
    were kept and relabelled as tenant relationships rather than deleted. Probed api., data., shib. and
    sso. subdomains for a course/timetable/open-data surface; none resolve. No endpoints were fabricated.'
  endpoints:
