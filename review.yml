  rating: 2
  summary: 'Verified live: the ORDA research data repository (orda.shef.ac.uk) and its OAI-PMH endpoint,
    the figshare REST API used by ORDA, and both White Rose OAI-PMH endpoints (WRRO and WREO) which correctly
    Identify as their respective repositories. The official SheffieldUni GitHub organization is live with
    public IT/integration tooling. No general self-service developer portal or documented course/timetable/student-information
    APIs were found; most institutional APIs are platform-provided (figshare, EPrints) rather than Sheffield-branded.
    No endpoints were fabricated; the shibboleth host did not resolve and was excluded.'
