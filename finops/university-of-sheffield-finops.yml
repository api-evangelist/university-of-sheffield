description: 'FinOps profile for the University of Sheffield. As a public higher-education institution
  it operates no usage-based API billing: the one API it runs itself (Sheffield Solar) is free and keyless
  for reads, and every other surface is a bought platform whose cost is a procurement line, not an API
  charge. There is no invoiced API cost to allocate or optimise.'
notes: No public usage-based API billing. Sheffield is an API buyer, not an API seller.
