modified: '2026-08-30'
reconciled: false
tags:
- Education
- Higher Education
- University
- Rate Limiting
description: The University of Sheffield publishes no rate-limit table for any of its surfaces. The Sheffield
  Solar API returned no RateLimit-* or X-RateLimit-* headers on probe (2026-08-30) and its published OpenAPI
  declares no 429 response. The OAI-PMH endpoints on the White Rose repositories may throttle large harvests;
  ORDA sits behind Cloudflare, which will challenge or throttle automated clients irrespective of any
  Sheffield policy. Harvest politely, honour Retry-After, and contact the relevant service for bulk access.
notes: No published global limit. Per-service limits are undocumented; confirm with each service.
sources:
- https://raw.githubusercontent.com/api-evangelist/university-of-sheffield/refs/heads/main/apis.yml
responseCodes:
  throttled: 429
limits:
- name: Default
  scope: client
  metric: requests-per-minute
  limit: not published
  notes: No RateLimit headers observed on api.solar.sheffield.ac.uk; no 429 declared in the contract.
policies:
- name: Backoff Strategy
  description: Exponential backoff with jitter; honor Retry-After; harvest during off-peak hours.
