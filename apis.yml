aid: university-of-sheffield
name: University of Sheffield
x-type: university
x-category: Public Research University
description: >-
  The University of Sheffield is a public research university in Sheffield, United
  Kingdom, and a member of the Russell Group. Its programmable footprint is small,
  decentralised and mostly indirect, and this profile says so rather than padding it.
  There is no central developer portal, no API gateway, no self-service key issuance
  and no documented course, timetable or student-information API. What the institution
  genuinely operates is one first-party research API — the Sheffield Solar API at
  api.solar.sheffield.ac.uk, which publishes its own OpenAPI 3.1 document and serves
  keyless PV_Live estimates of GB solar generation — and its own Shibboleth SAML
  identity provider at idp.shef.ac.uk, the authentication surface through which every
  bought platform is reached. Everything else that looks like a Sheffield API is a
  vendor's contract running under Sheffield's name: ORDA is figshare, White Rose
  Research Online and White Rose eTheses Online are EPrints instances shared with
  Leeds and York, and library discovery is Ex Libris Primo. Those are recorded here as
  tenant relationships, which they are, and not as Sheffield engineering, which they
  are not.
type: Index
position: Producing
access: Public
