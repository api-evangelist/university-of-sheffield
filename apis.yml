- aid: university-of-sheffield:orda
  name: ORDA — Online Research Data (figshare tenant)
  x-operator: tenant
  description: >-
    ORDA is the University of Sheffield's research data repository at orda.shef.ac.uk. The records, the
    DOIs and the curation are Sheffield's; the platform and the API contract are figshare's. Sheffield
    is a registered DataCite provider (id ooki) and ORDA is a registered DataCite repository client (id
    bl.shef), so deposits mint DataCite DOIs. NO SPEC IS SAVED HERE ON PURPOSE — the figshare contract
    belongs in figshare's own repository, and attributing it to Sheffield is the specific defect this
    profile was re-run to correct. The relationship is real and is recorded; the engineering is not Sheffield's.
    ORDA's OAI-PMH endpoint is live but returns a Cloudflare 202 challenge to scripted clients.
