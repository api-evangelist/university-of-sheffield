apis:
  - aid: university-of-sheffield:sheffield-solar-api
    name: Sheffield Solar API
    x-operator: institution
    description: >-
      The University of Sheffield's own research API, built and run by the Sheffield
      Solar group in the Department of Physics and Astronomy. It publishes PV_Live —
      near-real-time and historical estimates of solar photovoltaic generation on the
      GB transmission network, by Grid Supply Point and Public Electricity Supplier
      region — plus PV_Live_EU over European NUTS regions and PV_Forecast day-ahead
      forecasts. PV_Live read endpoints are keyless and answered 200 on probe;
      PV_Forecast returns 401 without a registered X-User-Id header. The institution
      publishes its own OpenAPI 3.1 document, a Swagger UI and a Redoc rendering. This
      is the one contract in this repository that Sheffield actually wrote.
    humanURL: https://www.solar.sheffield.ac.uk/api/
