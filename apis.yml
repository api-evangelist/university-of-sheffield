  detail: >-
    Sheffield does operate a real, first-party, machine-readable API surface, and it
    was found and verified: the Sheffield Solar API publishes its own OpenAPI 3.1
    document at https://api.solar.sheffield.ac.uk/openapi.json and answers keyless
    requests, and the institution's Shibboleth IdP serves live SAML 2.0 metadata from
    its own domain. The footprint is nonetheless narrow. No central developer portal,
    course catalog, timetable, campus-life or open-data API was found on any Sheffield
    host after probing api., data., courses. and sis. subdomains, all of which fail to
    resolve. The research repositories are real institutional facts but vendor-operated,
    and are recorded as tenant. ORDA's own OAI-PMH endpoint is live but returns a
    Cloudflare 202 bot challenge to scripted clients, so its Identify response could
