openapi: 3.2.0
info:
  title: Sheffield Solar Admin API
  version: 0.1.0
tags:
- name: Admin
paths:
  /admin/admin_page/{sort_col}/{direction}:
    get:
      tags:
      - Admin
      summary: Admin Page
      description: 'Render the admin user list page, sorted by the specified column.

        Admin — requires superuser.


        Raises HTTP 400 if sort_col is not in the allowed whitelist (prevents SQL injection).

        Requires superuser privileges.'
      operationId: admin_page_admin_admin_page__sort_col___direction__get
      security:
      - OAuth2PasswordBearer: []
      - APIKeyCookie: []
      parameters:
      - name: sort_col
        in: path
        required: true
        schema:
          type: string
          title: Sort Col
      - name: direction
        in: path
        required: true
        schema:
          type: string
          title: Direction
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/admin_page/:
    get:
      tags:
      - Admin
      summary: Admin Page
      description: 'Render the admin user list page, sorted by the specified column.

        Admin — requires superuser.


        Raises HTTP 400 if sort_col is not in the allowed whitelist (prevents SQL injection).

        Requires superuser privileges.'
      operationId: admin_page_admin_admin_page__get
      security:
      - OAuth2PasswordBearer: []
      - APIKeyCookie: []
      parameters:
      - name: sort_col
        in: query
        required: false
        schema:
          type: string
          default: id
          title: Sort Col
      - name: direction
        in: query
        required: false
        schema:
          type: string
          default: asc
          title: Direction
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/admin_form/{user_id}:
    get:
      tags:
      - Admin
      summary: Admin User Form
      description: Show the admin user edit form (GET).
      operationId: admin_user_form_admin_admin_form__user_id__get
      security:
      - OAuth2PasswordBearer: []
      - APIKeyCookie: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/admin_page/region/{user_id}:
    post:
      tags:
      - Admin
      summary: Submit Region
      description: Replace all region assignments for a user (POST).
      operationId: submit_region_admin_admin_page_region__user_id__post
      security:
      - OAuth2PasswordBearer: []
      - APIKeyCookie: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/admin_page/token/{user_id}:
    post:
      tags:
      - Admin
      summary: Submit Token
      description: Update token fields for a user (POST).
      operationId: submit_token_admin_admin_page_token__user_id__post
      security:
      - OAuth2PasswordBearer: []
      - APIKeyCookie: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/admin_page/token_gen/{user_id}:
    post:
      tags:
      - Admin
      summary: Submit Token Gen
      description: Regenerate or freshly create the API key for a user (POST).
      operationId: submit_token_gen_admin_admin_page_token_gen__user_id__post
      security:
      - OAuth2PasswordBearer: []
      - APIKeyCookie: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/admin_page/user/{user_id}:
    post:
      tags:
      - Admin
      summary: Submit User
      description: Update profile fields for a user (POST).
      operationId: submit_user_admin_admin_page_user__user_id__post
      security:
      - OAuth2PasswordBearer: []
      - APIKeyCookie: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /auth/jwt/login
    APIKeyCookie:
      type: apiKey
      in: cookie
      name: ssapi_session
    HTTPBasic:
      type: http
      scheme: basic
