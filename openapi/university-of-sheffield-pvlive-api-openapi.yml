          - type: 'null'
          description: 'Deprecated: The 5 minute interval is no longer available. The 30 minute interval is the default.'
          deprecated: true
          title: Period
        description: 'Deprecated: The 5 minute interval is no longer available. The 30 minute interval is the default.'
        deprecated: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pvlive/api/v4/gsp_list:
    get:
      tags:
      - pvlive
      summary: PV_Live GSP List
      description: List all GSP regions.
      operationId: pvlive_gsp_list_pvlive_api_v4_gsp_list_get
      parameters:
      - name: data_format
